    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <script>

        let destMarker = null;
        let routingControl = null;
        let userCoords = null;
        let destCoords = null;
        let currentVehicle = 'car';

        const translations = {

        let streetLayer, satelliteLayer;

        function initMap() {
            map = L.map('map', { 
                zoomControl: false, 
                dragging: true,
                tap: true,
                touchZoom: true,
                scrollWheelZoom: true,
                doubleClickZoom: true
            }).setView([17.9757, 102.6331], 14);

            streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });
            satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });

            streetLayer.addTo(map);

            map.on('click', function(e) {
                setDestination(e.latlng.lat, e.latlng.lng);
            });

            changeLanguage('lo', 'ລາວ', 'la');
            fetchAutoGPS();
        }

        function toggleMapLayer() {
            const t = translations[currentLang];
            if (isSatellite) {
                map.removeLayer(satelliteLayer);
                streetLayer.addTo(map);
                isSatellite = false;
                document.getElementById('layer-icon').className = "fa-solid fa-satellite text-blue-600";
                document.getElementById('lbl-layer-toggle').innerText = t.layerSat;
            } else {
                map.removeLayer(streetLayer);
                satelliteLayer.addTo(map);
                isSatellite = true;
                document.getElementById('layer-icon').className = "fa-solid fa-map text-emerald-600";
                document.getElementById('lbl-layer-toggle').innerText = t.layerRoad;
            }
        }

        function toggleLangMenu() {
            const menu = document.getElementById('lang-menu');
            menu.classList.toggle('hidden');
        }

        window.addEventListener('click', function(e) {
            if (!document.getElementById('current-lang-btn').contains(e.target) && !document.getElementById('lang-menu').contains(e.target)) {
                document.getElementById('lang-menu').classList.add('hidden');
            }
        });

        function changeLanguage(lang, name, flagArg, isCustomUrl = false) {
            currentLang = lang;
            const t = translations[lang];

            if(name && flagArg) {
                document.getElementById('current-lang-name').innerText = name;
                document.getElementById('current-flag').src = isCustomUrl ? flagArg : `https://flagcdn.com/w40/${flagArg}.png`;
            }
            document.getElementById('lang-menu').classList.add('hidden');

            document.getElementById('lbl-brand').innerText = t.brand;
            document.getElementById('lbl-subtitle').innerText = t.subtitle;
            document.getElementById('lbl-vehicle-title').innerText = t.vehicleTitle;
            document.getElementById('lbl-instruction').innerText = t.instruction;
            document.getElementById('lbl-car').innerText = t.car;
            document.getElementById('lbl-moto').innerText = t.moto;
            document.getElementById('lbl-bicycle').innerText = t.bicycle;
            document.getElementById('lbl-walk').innerText = t.walk;
            document.getElementById('lbl-result-title').innerText = t.resultTitle;
            document.getElementById('lbl-fastest').innerText = t.fastest;
            document.getElementById('lbl-dist-title').innerText = t.distTitle;
            document.getElementById('lbl-time-title').innerText = t.timeTitle;
            document.getElementById('lbl-arrive-title').innerText = t.arriveTitle;
            document.getElementById('lbl-layer-toggle').innerText = isSatellite ? t.layerRoad : t.layerSat;

            document.querySelectorAll('.dist-unit').forEach(el => el.innerText = t.distUnit);
            
            if (window.lastTotalMinutes !== undefined) {
                updateDurationDisplay(window.lastTotalMinutes);
            } else {
                document.querySelectorAll('.time-unit').forEach(el => el.innerText = t.minUnit);
            }
        }

        const vehicleSpeeds = { car: 45, moto: 50, bicycle: 18, walk: 5 };

        function fetchAutoGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        userCoords = [lat, lng];

                        if (!userMarker) {
                            const userIcon = L.divIcon({
                                className: 'custom-user-marker',
                                html: `<div class="w-7 h-7 bg-blue-600 rounded-full border-4 border-white shadow-lg animate-pulse flex items-center justify-center"><div class="w-2.5 h-2.5 bg-white rounded-full"></div></div>`,
                                iconSize: [28, 28],
                                iconAnchor: [14, 14]
                            });
                            userMarker = L.marker(userCoords, { icon: userIcon }).addTo(map);
                        } else {
                            userMarker.setLatLng(userCoords);
                        }

                        map.setView(userCoords, 16, { animate: false });

                        if (destCoords) {
                            calculateRoute();
                        }
                    },
                    (error) => {
                        if (!userCoords) {
                            userCoords = [17.9715, 102.6133]; 
                            userMarker = L.marker(userCoords).addTo(map);
                            map.setView(userCoords, 15);
                        }
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            }
        }

        function setDestination(lat, lng) {
            destCoords = [lat, lng];

            if (!destMarker) {
                const destIcon = L.divIcon({
                    className: 'custom-dest-marker',
                    html: `<div class="w-8 h-8 bg-red-500 rounded-full border-2 border-white shadow-xl flex items-center justify-center text-white"><i class="fa-solid fa-location-dot"></i></div>`,
                    iconSize: [32, 32],
                    iconAnchor: [16, 32]
                });
                destMarker = L.marker(destCoords, { icon: destIcon, draggable: true }).addTo(map);
                
                destMarker.on('dragend', function(event) {
                    const pos = event.target.getLatLng();
                    destCoords = [pos.lat, pos.lng];
                    calculateRoute();
                });
            } else {
                destMarker.setLatLng(destCoords);
            }

            calculateRoute();
        }

        function setVehicle(type) {
            currentVehicle = type;
            document.querySelectorAll('.vehicle-btn').forEach(btn => {
                btn.classList.remove('border-blue-600', 'bg-blue-50', 'text-blue-600');
                btn.classList.add('border-gray-200', 'bg-white', 'text-gray-500');
            });
            const activeBtn = document.getElementById(`btn-${type}`);
            activeBtn.classList.remove('border-gray-200', 'bg-white', 'text-gray-500');
            activeBtn.classList.add('border-blue-600', 'bg-blue-50', 'text-blue-600');

            if (userCoords && destCoords) {
                calculateRoute();
            }
        }

        function updateDurationDisplay(totalMinutes) {
            window.lastTotalMinutes = totalMinutes;
            const t = translations[currentLang];
            const durationEl = document.getElementById('txt-duration');

            if (totalMinutes === 0) {
                durationEl.innerHTML = `0 <span class="time-unit">${t.minUnit}</span>`;
                return;
            }

            if (totalMinutes < 60) {
                durationEl.innerHTML = `${totalMinutes} <span class="time-unit">${t.minUnit}</span>`;
            } else {
                const hours = Math.floor(totalMinutes / 60);
                const minutes = totalMinutes % 60;
                durationEl.innerHTML = `${hours} <span class="time-unit">${t.hourUnit}</span> ${minutes} <span class="time-unit">${t.minUnit}</span>`;
            }
        }

        function calculateRoute() {
            if (!userCoords || !destCoords) return;

            if (routingControl) {
                map.removeControl(routingControl);
            }

            routingControl = L.Routing.control({
                waypoints: [
                    L.latLng(userCoords[0], userCoords[1]),
                    L.latLng(destCoords[0], destCoords[1])
                ],
                routeWhileDragging: false,
                addWaypoints: false,
                createMarker: function() { return null; },
                lineOptions: {
                    styles: [{ color: '#1a73e8', weight: 6, opacity: 0.9 }]
                }
            }).addTo(map);

            routingControl.on('routesfound', function(e) {
                const routes = e.routes;
                if (routes && routes.length > 0) {
                    const route = routes[0];
                    const distanceKm = (route.summary.totalDistance / 1000);
                    
                    const speed = vehicleSpeeds[currentVehicle];
                    const timeInHours = distanceKm / speed;
                    const timeInMinutes = Math.round(timeInHours * 60);

                    const t = translations[currentLang];
                    updateDurationDisplay(timeInMinutes);

                    const now = new Date();
                    now.setMinutes(now.getMinutes() + timeInMinutes);
                    const arrivalTimeStr = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

                    document.getElementById('txt-distance').innerHTML = `${distanceKm.toFixed(1)} <span class="dist-unit">${t.distUnit}</span>`;
                    document.getElementById('txt-arrival').innerText = arrivalTimeStr;
                }
            });
        }

        function resetAll() {
            if (destMarker) {
                map.removeLayer(destMarker);
                destMarker = null;
            }
            if (routingControl) {
                map.removeControl(routingControl);
                routingControl = null;
            }
            destCoords = null;
            window.lastTotalMinutes = 0;
            const t = translations[currentLang];
            document.getElementById('txt-distance').innerHTML = `0 <span class="dist-unit">${t.distUnit}</span>`;
            updateDurationDisplay(0);
            document.getElementById('txt-arrival').innerText = '-';
            fetchAutoGPS();
        }

        window.onload = initMap;
    </script>
</body>
</html>
